<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashVote</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      height: 100%;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .waveform {
      width: 70%;
      max-width: 900px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .title {
      font-size: 64px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .tagline {
      font-size: 20px;
      color: #ccc;
    }

    @media (max-width: 768px) {
      .title {
        font-size: 42px;
      }

      .waveform {
        width: 90%;
      }

      .tagline {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">

    <!-- IMPORTANT: Make sure this file exists in same folder -->
    <img src="signal-line.png" alt="" class="waveform" />

    <div class="title">FlashVote</div>

    <div class="tagline">
      Sentiment moves fast. Outcomes follow.
    </div>

  </div>

</body>
</html>
