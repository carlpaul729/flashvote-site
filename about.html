<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashVote</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* PAGE WRAPPER */
  .page {
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND (FIXED ISSUE SOLVED) */
  .about-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 120%;

    background-image: url('/flashvote-about-bg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    filter: brightness(0.88) contrast(1.02);

    z-index: -2;
  }

  /* CENTER PROTECTION OVERLAY */
  .about-overlay {
    position: absolute;
    inset: 0;
    z-index: -1;

    background: radial-gradient(
      ellipse at center,
      rgba(0,0,0,0.92) 0%,
      rgba(0,0,0,0.85) 40%,
      rgba(0,0,0,0.6) 65%,
      rgba(0,0,0,0.2) 85%,
      rgba(0,0,0,0) 100%
    );
  }

  /* CONTENT */
  .about-content {
    position: relative;
    z-index: 1;

    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    max-width: 560px;
    padding: 52px 20px 70px;
    text-align: center;
  }

  .title {
    font-size: clamp(36px, 5vw, 46px);
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 10px;
  }

  .tagline {
    font-size: 16px;
    line-height: 1.5;
    color: #aaa;
    margin-bottom: 14px;
  }

  .subtext {
    font-size: 14px;
    line-height: 1.6;
    color: #777;
    margin-bottom: 36px;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 1.6px;
    color: #777;
    margin-bottom: 10px;
  }

  .ca-box {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
    border: 1px solid rgba(255,140,0,0.42);
    color: #ddd;
    margin-bottom: 6px;
    font-family: monospace;
    word-break: break-all;
  }

  .copy-btn {
    font-size: 11.5px;
    letter-spacing: 0.4px;
    color: #ff8c00;
    cursor: pointer;
    margin-bottom: 30px;
    opacity: 0.75;
    transition: opacity 0.2s ease;
  }

  .copy-btn:hover {
    opacity: 1;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }

  .btn {
    padding: 11px 18px;
    border-radius: 6px;
    border: 1px solid rgba(255,140,0,0.42);
    color: #ff8c00;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .btn:hover {
    background: rgba(255,140,0,0.06);
    border-color: rgba(255,140,0,0.85);
    color: #fff;
  }

  .steps {
    font-size: 14px;
    color: #bbb;
    line-height: 1.8;
    margin-bottom: 36px;
  }

  .follow-btn {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 6px;
    border: 1px solid rgba(255,140,0,0.42);
    color: #ff8c00;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .follow-btn:hover {
    background: rgba(255,140,0,0.06);
    border-color: rgba(255,140,0,0.85);
    color: #fff;
  }

  @media (max-width: 600px) {
    .title {
      font-size: 34px;
    }
  }

  /* subtle load */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

</style>
</head>

<body>

<div class="page">

  <div class="about-bg"></div>
  <div class="about-overlay"></div>

  <div class="about-content">
    <div class="container">

      <div class="title">FlashVote</div>

      <div class="tagline">
        Sentiment moves fast. Outcomes follow.
      </div>

      <div class="subtext">
        FlashVote reflects real-time shifts in digital attention.
      </div>

      <div class="section-label">CONTRACT ADDRESS</div>

      <div class="ca-box" id="contract">
        0x1234567890abcdef1234567890abcdef12345678
      </div>

      <div class="copy-btn" id="copyBtn" onclick="copyCA()">Copy</div>

      <div class="section-label">BUY FLASHVOTE</div>

      <div class="actions">
        <a href="https://app.uniswap.org" target="_blank" class="btn">
          Buy on Uniswap
        </a>

        <a href="https://dexscreener.com" target="_blank" class="btn">
          View Chart
        </a>
      </div>

      <div class="section-label">HOW TO BUY</div>

      <div class="steps">
        Connect wallet<br>
        Paste contract address<br>
        Swap for FlashVote
      </div>

      <div class="section-label">FOLLOW</div>

      <a href="https://x.com/flashvotehq" target="_blank" class="follow-btn">
        X (Twitter)
      </a>

    </div>
  </div>

</div>

<script>
function copyCA() {
  const text = document.getElementById("contract").innerText;
  const btn = document.getElementById("copyBtn");

  navigator.clipboard.writeText(text);

  btn.innerText = "Copied";

  setTimeout(() => {
    btn.innerText = "Copy";
  }, 1400);
}
</script>

</body>
</html>
