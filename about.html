<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>FlashVote</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
    background:#000;
    overflow-x:hidden;
}

body{
    width:100%;
    min-height:100svh;
    background:#000;
    color:#ffffff;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
    position:relative;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-2;

    background-image:url('flashvote-about-bg.png');
    background-repeat:no-repeat;
    background-position:center center;
    background-size:cover;

    opacity:0.92;

    transform:translateZ(0);
    will-change:transform;
}

/* DARK OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-1;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,0.72),
        rgba(0,0,0,0.60),
        rgba(0,0,0,0.72)
    );
}

/* CONTENT */

.container{
    width:100%;
    min-height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:120px 24px;

    position:relative;
    z-index:2;
}

.content{
    width:100%;
    max-width:760px;

    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

/* TYPOGRAPHY */

h1{
    font-size:clamp(3.4rem, 7vw, 6rem);
    font-weight:800;
    letter-spacing:-2px;
    margin-bottom:28px;
}

.tagline{
    font-size:clamp(1.6rem, 2vw, 2.2rem);
    color:rgba(255,255,255,0.82);
    margin-bottom:34px;
    line-height:1.4;
}

.description{
    font-size:clamp(1.2rem, 1.5vw, 1.45rem);
    color:rgba(255,255,255,0.58);
    line-height:1.7;
    margin-bottom:78px;
}

/* SECTION LABELS */

.section-label{
    font-size:0.95rem;
    letter-spacing:6px;
    color:rgba(255,255,255,0.42);
    margin-bottom:22px;
}

/* CONTRACT */

.contract-box{
    width:100%;
    max-width:620px;

    border:1px solid rgba(255,140,40,0.45);
    border-radius:16px;

    padding:20px 24px;

    background:rgba(0,0,0,0.35);

    color:#ffffff;
    font-size:1.1rem;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    margin-bottom:18px;
}

.copy-btn{
    background:none;
    border:none;

    color:#ff9d3b;
    font-size:1rem;

    cursor:pointer;

    margin-bottom:70px;
}

/* BUTTONS */

.button-row{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:center;

    margin-bottom:76px;
}

.button{
    min-width:220px;

    padding:18px 34px;

    border:1px solid rgba(255,140,40,0.45);
    border-radius:16px;

    background:rgba(0,0,0,0.28);

    color:#ff9d3b;

    text-decoration:none;

    font-size:1.2rem;
    font-weight:500;

    transition:0.25s ease;
}

.button:hover{
    background:rgba(255,140,40,0.10);
    border-color:#ff9d3b;
}

/* HOW TO BUY */

.steps{
    display:flex;
    flex-direction:column;
    gap:18px;

    margin-bottom:80px;

    font-size:1.15rem;
    line-height:1.6;
    color:rgba(255,255,255,0.86);
}

/* FOLLOW BUTTON */

.follow-btn{
    padding:18px 34px;

    border:1px solid rgba(255,140,40,0.45);
    border-radius:16px;

    background:rgba(0,0,0,0.28);

    color:#ff9d3b;

    text-decoration:none;

    font-size:1.2rem;

    transition:0.25s ease;
}

.follow-btn:hover{
    background:rgba(255,140,40,0.10);
    border-color:#ff9d3b;
}

/* MOBILE PORTRAIT */

@media (max-width:768px) and (orientation:portrait){

    .background{
        background-size:cover;
        background-position:center center;
    }

    .container{
        padding:90px 22px 120px;
    }

    h1{
        font-size:4rem;
        margin-bottom:24px;
    }

    .tagline{
        font-size:1.1rem;
        margin-bottom:30px;
    }

    .description{
        font-size:1rem;
        margin-bottom:64px;
    }

    .contract-box{
        font-size:0.92rem;
        padding:18px 18px;
    }

    .button{
        width:100%;
        min-width:unset;
        font-size:1.1rem;
    }

    .steps{
        font-size:1rem;
    }

}

/* MOBILE LANDSCAPE */

@media (max-width:950px) and (orientation:landscape){

    .background{
        background-size:contain;
        background-position:center center;
        background-color:#000;
    }

    .container{
        padding:70px 30px;
    }

    h1{
        font-size:3.5rem;
    }

    .tagline{
        font-size:1.2rem;
    }

    .description{
        font-size:1rem;
    }

}

/* LARGE DESKTOP */

@media (min-width:1600px){

    .background{
        background-size:cover;
    }

}

</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="container">

    <div class="content">

        <h1>FlashVote</h1>

        <div class="tagline">
            Sentiment moves fast. Outcomes follow.
        </div>

        <div class="description">
            FlashVote reflects real-time shifts in digital attention.
        </div>

        <div class="section-label">
            CONTRACT ADDRESS
        </div>

        <div class="contract-box">
            0x1234567890abcdef1234567890abcdef12345678
        </div>

        <button class="copy-btn">
            Copy
        </button>

        <div class="section-label">
            BUY FLASHVOTE
        </div>

        <div class="button-row">

            <a href="#" class="button">
                Buy on Uniswap
            </a>

            <a href="#" class="button">
                View Chart
            </a>

        </div>

        <div class="section-label">
            HOW TO BUY
        </div>

        <div class="steps">
            <div>Connect wallet</div>
            <div>Paste contract address</div>
            <div>Swap for FlashVote</div>
        </div>

        <div class="section-label">
            FOLLOW
        </div>

        <a href="#" class="follow-btn">
            X (Twitter)
        </a>

    </div>

</div>

</body>
</html>
