<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashVote</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100svh;
      height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      background-color: #000;
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND LAYER (LOCKED)
    ========================== */
    .about-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100svh;

      background-image: url('background.png'); /* <-- REPLACE */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      z-index: -2;
    }

    /* =========================
       OVERLAY (SUBTLE CONTROL)
    ========================== */
    .about-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100svh;

      background: rgba(0, 0, 0, 0.18);

      z-index: -1;
    }

    /* =========================
       CONTENT LAYER
    ========================== */
    .about-content {
      position: relative;
      z-index: 1;

      min-height: 100svh;
      height: 100svh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      padding: 20px;
    }

    /* =========================
       HERO
    ========================== */
    h1 {
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin-top: 10px;
      font-size: 18px;
      opacity: 0.85;
    }

    .subtext {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.6;
    }

    /* =========================
       ACTION SECTION
    ========================== */
    .section {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .label {
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.5;
    }

    /* CONTRACT BOX (SMALLER + TIGHT) */
    .ca-box {
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 140, 0, 0.25);
      font-size: 13px;
      max-width: 90vw;
      word-break: break-all;
      backdrop-filter: blur(6px);
    }

    .copy-btn {
      margin-top: 6px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.7;
      transition: 0.2s;
    }

    .copy-btn:hover {
      opacity: 1;
      color: orange;
    }

    /* BUTTONS */
    .buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid rgba(255, 140, 0, 0.6);
      background: transparent;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      transition: 0.25s ease;
    }

    .btn:hover {
      box-shadow: 0 0 12px rgba(255, 140, 0, 0.4);
      border-color: orange;
    }

    /* =========================
       HOW TO BUY
    ========================== */
    .steps {
      font-size: 14px;
      opacity: 0.7;
      line-height: 1.6;
    }

    /* =========================
       FOLLOW
    ========================== */
    .follow a {
      text-decoration: none;
      color: white;
      font-size: 14px;
      opacity: 0.7;
      transition: 0.2s;
    }

    .follow a:hover {
      opacity: 1;
      color: orange;
    }

    /* =========================
       iOS SAFARI FIX
    ========================== */
    @supports (-webkit-touch-callout: none) {
      .about-bg,
      .about-overlay {
        height: -webkit-fill-available;
      }

      .about-content {
        min-height: -webkit-fill-available;
        height: auto;
      }
    }

    /* =========================
       MOBILE FIX
    ========================== */
    @media (max-width: 768px) {
      .about-content {
        justify-content: center;
        padding: 24px;
      }
    }

  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="about-bg"></div>

  <!-- OVERLAY -->
  <div class="about-overlay"></div>

  <!-- CONTENT -->
  <div class="about-content">

    <!-- HERO -->
    <h1>FlashVote</h1>
    <div class="tagline">Sentiment moves fast. Outcomes follow.</div>
    <div class="subtext">FlashVote reflects real-time shifts in digital attention.</div>

    <!-- CONTRACT -->
    <div class="section">
      <div class="label">CONTRACT ADDRESS</div>
      <div class="ca-box" id="ca">
        0xYourContractAddressHere
      </div>
      <div class="copy-btn" onclick="copyCA()">Copy</div>
    </div>

    <!-- BUY -->
    <div class="section">
      <div class="label">BUY FLASHVOTE</div>
      <div class="buttons">
        <a href="#" class="btn">Buy on Uniswap</a>
        <a href="#" class="btn">View Chart</a>
      </div>
    </div>

    <!-- HOW TO BUY -->
    <div class="section">
      <div class="label">HOW TO BUY</div>
      <div class="steps">
        Connect wallet<br>
        Paste contract address<br>
        Swap for FlashVote
      </div>
    </div>

    <!-- FOLLOW -->
    <div class="section follow">
      <div class="label">FOLLOW</div>
      <a href="https://x.com/flashvotehq" target="_blank">X (Twitter)</a>
    </div>

  </div>

  <!-- JS -->
  <script>
    function copyCA() {
      const ca = document.getElementById("ca").innerText;
      navigator.clipboard.writeText(ca).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.innerText = "Copied";
        setTimeout(() => {
          btn.innerText = "Copy";
        }, 1500);
      });
    }
  </script>

</body>
</html>
