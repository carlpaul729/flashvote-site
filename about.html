<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashVote Waveform Test</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 20px;
      text-align: center;
    }

    .waveform {
      width: 100%;
      max-width: 900px;
      display: block;
      margin: 0 auto;
    }

    /* optional test backgrounds */
    .test-light {
      background: white;
      padding: 40px;
      margin-top: 40px;
    }

    .label {
      color: white;
      margin-bottom: 10px;
      font-size: 14px;
      opacity: 0.7;
    }

    .light-label {
      color: black;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="label">Dark Background (your real site)</div>
    <img src="waveform.png" alt="Waveform" class="waveform" />

    <div class="test-light">
      <div class="label light-label">Light Background Test (transparency check)</div>
      <img src="waveform.png" alt="Waveform" class="waveform" />
    </div>

  </div>

</body>
</html>
