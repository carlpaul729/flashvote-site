<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashVote</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
      background:
        radial-gradient(circle at center, rgba(255,140,0,0.08), transparent 55%),
        black;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    /* TITLE */
    h1 {
      font-size: 34px;
      margin-bottom: 6px; /* tighter */
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* SIGNAL LINE (NEW - CORRECT WAY) */
    .signal-line {
      width: 520px;
      max-width: 85%;
      margin: 6px auto 8px; /* tight + centered */
      display: block;
      filter: drop-shadow(0 0 16px rgba(255,140,0,0.55));
    }

    /* TAGLINE */
    .tagline {
      font-size: 17px;
      color: rgba(255,255,255,0.78);
      margin-bottom: 36px; /* slightly tightened */
    }

    .section {
      margin-bottom: 42px;
    }

    .section-title {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,140,0,0.85);
      margin-bottom: 14px;
    }

    .description {
      font-size: 17px;
      line-height: 1.6;
      color: rgba(255,255,255,0.88);
    }

    .ca-box {
      display: inline-block;
      padding: 14px 18px;
      border: 1px solid rgba(255,140,0,0.45);
      border-radius: 10px;
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      word-break: break-all;
      margin-top: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .ca-box:hover {
      background: rgba(255,140,0,0.08);
      box-shadow: 0 0 12px rgba(255,140,0,0.2);
    }

    .copied {
      border-color: rgba(0,255,140,0.6);
      box-shadow: 0 0 10px rgba(0,255,140,0.25);
    }

    .button {
      display: inline-block;
      margin: 10px;
      padding: 14px 26px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-size: 15px;
      transition: 0.25s ease;
    }

    .primary {
      border: 1px solid rgba(255,140,0,0.8);
      box-shadow: 0 0 16px rgba(255,140,0,0.25);
    }

    .primary:hover {
      background: rgba(255,140,0,0.12);
      box-shadow: 0 0 20px rgba(255,140,0,0.35);
    }

    .secondary {
      border: 1px solid rgba(255,140,0,0.4);
    }

    .secondary:hover {
      background: rgba(255,140,0,0.08);
    }

    .steps {
      font-size: 16px;
      line-height: 2;
      color: rgba(255,255,255,0.88);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 28px;
      }

      .signal-line {
        width: 85%;
      }

      .description,
      .steps {
        font-size: 15px;
      }

      .button {
        display: block;
        width: 100%;
        max-width: 260px;
        margin: 12px auto;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>FlashVote</h1>

    <!-- SIGNAL LINE INSERTED HERE -->
    <img src="signal-line.png" class="signal-line" alt="signal">

    <div class="tagline">
      Sentiment moves fast. Outcomes follow.
    </div>

    <div class="section">
      <div class="section-title">What is FlashVote</div>
      <div class="description">
        FlashVote reflects fast-moving digital attention in real time.
      </div>
    </div>

    <div class="section">
      <div class="section-title">Contract Address</div>
      <div class="ca-box" id="caBox" onclick="copyCA()">
        0xYOURCONTRACTADDRESSHERE
      </div>
    </div>

    <div class="section">
      <div class="section-title">Buy FlashVote</div>

      <a href="https://app.uniswap.org/" target="_blank" class="button primary">
        Buy on Uniswap
      </a>

      <a href="https://dexscreener.com/" target="_blank" class="button secondary">
        View Chart
      </a>
    </div>

    <div class="section">
      <div class="section-title">How to Buy</div>
      <div class="steps">
        1. Connect wallet<br>
        2. Paste contract address<br>
        3. Swap for FlashVote
      </div>
    </div>

    <div class="section">
      <div class="section-title">Follow</div>

      <a href="https://x.com/flashvotehq" target="_blank" class="button secondary">
        X
      </a>
    </div>

  </div>

  <script>
    function copyCA() {
      const caText = document.getElementById("caBox").innerText;

      navigator.clipboard.writeText(caText);

      const box = document.getElementById("caBox");
      box.classList.add("copied");

      const original = caText;
      box.innerText = "Copied";

      setTimeout(() => {
        box.classList.remove("copied");
        box.innerText = original;
      }, 1500);
    }
  </script>

</body>
</html>
