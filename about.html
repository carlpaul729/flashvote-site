<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashVote</title>

<style>

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

    min-height: 100svh;
    height: 100svh;
    overflow-x: hidden;
  }

  /* =========================
     BACKGROUND SYSTEM (LOCKED)
  ========================== */

  .about-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100svh;

    background-image: url('background.png'); /* <-- your GitHub file */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -2;
  }

  .about-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100svh;

    background: rgba(0,0,0,0.18);

    z-index: -1;
  }

  /* =========================
     CONTENT
  ========================== */

  .about-content {
    position: relative;
    z-index: 1;

    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 70px 20px;
    text-align: center;
  }

  /* HERO */

  .title {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 18px;
    color: #aaa;
    margin-bottom: 8px;
  }

  .subtext {
    font-size: 14px;
    color: #777;
    margin-bottom: 55px;
  }

  /* SECTION LABEL */

  .section-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #777;
    margin-bottom: 12px;
  }

  /* CONTRACT BOX */

  .ca-box {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
    border: 1px solid rgba(255,140,0,0.35);
    color: #ddd;
    margin-bottom: 8px;
    box-shadow: 0 0 12px rgba(255,140,0,0.08);
  }

  .copy-btn {
    font-size: 12px;
    color: #ff8c00;
    cursor: pointer;
    margin-bottom: 45px;
    transition: opacity 0.2s ease;
  }

  .copy-btn:hover {
    opacity: 0.7;
  }

  /* BUTTONS */

  .actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 55px;
  }

  .btn {
    padding: 11px 20px;
    border-radius: 6px;
    border: 1px solid rgba(255,140,0,0.7);
    color: #ff8c00;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s ease;
    box-shadow: 0 0 10px rgba(255,140,0,0.05);
  }

  .btn:hover {
    background: rgba(255,140,0,0.9);
    color: #000;
  }

  /* HOW TO BUY */

  .steps {
    font-size: 15px;
    color: #bbb;
    line-height: 1.9;
    margin-bottom: 55px;
  }

  /* FOLLOW */

  .follow-btn {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 6px;
    border: 1px solid rgba(255,140,0,0.7);
    color: #ff8c00;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .follow-btn:hover {
    background: rgba(255,140,0,0.9);
    color: #000;
  }

  /* =========================
     MOBILE FIX
  ========================== */

  @media (max-width: 600px) {
    .title {
      font-size: 36px;
    }
  }

  /* =========================
     iOS SAFARI FIX
  ========================== */

  @supports (-webkit-touch-callout: none) {
    .about-bg,
    .about-overlay {
      height: -webkit-fill-available;
    }

    .about-content {
      min-height: -webkit-fill-available;
    }
  }

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="about-bg"></div>
<div class="about-overlay"></div>

<!-- CONTENT -->
<div class="about-content">
  <div class="container">

    <!-- HERO -->
    <div class="title">FlashVote</div>

    <div class="tagline">
      Sentiment moves fast. Outcomes follow.
    </div>

    <div class="subtext">
      FlashVote reflects real-time shifts in digital attention.
    </div>

    <!-- CONTRACT -->
    <div class="section-label">CONTRACT ADDRESS</div>

    <div class="ca-box" id="contract">
      0x1234567890abcdef1234567890abcdef12345678
    </div>

    <div class="copy-btn" id="copyBtn" onclick="copyCA()">Copy</div>

    <!-- BUY -->
    <div class="section-label">BUY FLASHVOTE</div>

    <div class="actions">
      <a href="https://app.uniswap.org" target="_blank" class="btn">
        Buy on Uniswap
      </a>

      <a href="https://dexscreener.com" target="_blank" class="btn">
        View Chart
      </a>
    </div>

    <!-- HOW TO BUY -->
    <div class="section-label">HOW TO BUY</div>

    <div class="steps">
      Connect wallet<br>
      Paste contract address<br>
      Swap for FlashVote
    </div>

    <!-- FOLLOW -->
    <div class="section-label">FOLLOW</div>

    <a href="https://x.com/flashvotehq" target="_blank" class="follow-btn">
      X (Twitter)
    </a>

  </div>
</div>

<script>
function copyCA() {
  const text = document.getElementById("contract").innerText;
  const btn = document.getElementById("copyBtn");

  navigator.clipboard.writeText(text);

  btn.style.opacity = "0.6";
  btn.innerText = "Copied";

  setTimeout(() => {
    btn.innerText = "Copy";
    btn.style.opacity = "1";
  }, 1400);
}
</script>

</body>
</html>
