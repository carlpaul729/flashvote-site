<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashVote</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* ===== HERO ===== */
.hero {
  padding: 80px 20px 40px;
}

h1 {
  font-size: 64px;
  margin-bottom: 10px;
}

.tagline {
  font-size: 20px;
  color: #ccc;
  margin-bottom: 40px;
}

/* ===== WAVEFORM ===== */
.wave-container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto 60px;
  height: 120px;
  position: relative;
}

.wave-line {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(to right, transparent, #ff7a1a, transparent);
}

.wave-bars {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  gap: 3px;
}

.bar {
  width: 2px;
  background: #ff7a1a;
  opacity: 0.9;
  box-shadow: 0 0 6px #ff7a1a;
}

/* Symmetrical heights */
.bar:nth-child(1) { height: 6px; }
.bar:nth-child(2) { height: 10px; }
.bar:nth-child(3) { height: 18px; }
.bar:nth-child(4) { height: 28px; }
.bar:nth-child(5) { height: 45px; }
.bar:nth-child(6) { height: 70px; }
.bar:nth-child(7) { height: 95px; }
.bar:nth-child(8) { height: 120px; }
.bar:nth-child(9) { height: 95px; }
.bar:nth-child(10) { height: 70px; }
.bar:nth-child(11) { height: 45px; }
.bar:nth-child(12) { height: 28px; }
.bar:nth-child(13) { height: 18px; }
.bar:nth-child(14) { height: 10px; }
.bar:nth-child(15) { height: 6px; }

/* ===== CONTENT ===== */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px 100px;
}

.section-title {
  color: #ff7a1a;
  font-weight: bold;
  margin-top: 40px;
  margin-bottom: 10px;
  font-size: 22px;
}

.text {
  color: #ccc;
  font-size: 16px;
  margin-bottom: 25px;
}

.contract-box {
  border: 2px solid #ff7a1a;
  padding: 12px;
  margin: 20px auto;
  max-width: 420px;
  font-size: 14px;
  word-break: break-all;
}

.buttons {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.btn {
  border: 2px solid #ff7a1a;
  padding: 10px 20px;
  text-decoration: none;
  color: #fff;
  transition: 0.2s;
}

.btn:hover {
  background: #ff7a1a;
  color: #000;
}

.steps {
  margin-top: 10px;
  color: #ccc;
  font-size: 15px;
  line-height: 1.6;
}

.x-btn {
  display: inline-block;
  border: 2px solid #ff7a1a;
  padding: 10px 16px;
  margin-top: 10px;
  text-decoration: none;
  color: #fff;
}

.x-btn:hover {
  background: #ff7a1a;
  color: #000;
}
</style>
</head>

<body>

<div class="hero">
  <h1>FlashVote</h1>
  <div class="tagline">Sentiment moves fast. Outcomes follow.</div>

  <!-- CLEAN WAVEFORM -->
  <div class="wave-container">
    <div class="wave-line"></div>
    <div class="wave-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>
</div>

<div class="container">

  <div class="section-title">WHAT IS FLASHVOTE</div>
  <div class="text">
    FlashVote reflects fast-moving digital attention in real time.
  </div>

  <div class="section-title">CONTRACT ADDRESS</div>
  <div class="contract-box">
    0xYOURCONTRACTADDRESSHERE
  </div>

  <div class="section-title">BUY FLASHVOTE</div>

  <div class="buttons">
    <a href="#" class="btn">Buy on Uniswap</a>
    <a href="#" class="btn">View Chart</a>
  </div>

  <div class="section-title">HOW TO BUY</div>
  <div class="steps">
    1. Connect wallet<br>
    2. Paste contract address<br>
    3. Swap for FlashVote
  </div>

  <div class="section-title">FOLLOW</div>
  <a href="#" class="x-btn">X</a>

</div>

</body>
</html>
