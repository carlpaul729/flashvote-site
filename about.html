<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlashVote</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* CONTAINER */
.container {
  max-width: 700px;
  margin: auto;
  padding: 60px 20px;
}

/* SIGNAL LINE */
.signal-line {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 30px;
  opacity: 0.9;
  animation: pulse 2.5s infinite ease-in-out;
}

@keyframes pulse {
  0% { opacity: 0.6; transform: scaleX(0.98); }
  50% { opacity: 1; transform: scaleX(1.02); }
  100% { opacity: 0.6; transform: scaleX(0.98); }
}

/* TITLE */
h1 {
  font-size: 42px;
  margin: 10px 0;
}

/* TAGLINE */
.tagline {
  color: #ccc;
  margin-bottom: 40px;
}

/* SECTION HEADERS */
.section-title {
  color: #ff7a00;
  margin-top: 40px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

/* SMALL GLOW LINE */
.divider {
  width: 60px;
  height: 2px;
  background: #ff7a00;
  margin: 10px auto 20px;
  box-shadow: 0 0 10px #ff7a00;
}

/* TEXT */
.text {
  color: #ddd;
  margin-bottom: 30px;
}

/* CONTRACT BOX */
.contract {
  display: inline-block;
  padding: 12px 20px;
  border: 1px solid #ff7a00;
  border-radius: 8px;
  margin-bottom: 30px;
}

/* BUTTONS */
.buttons {
  margin: 20px 0;
}

.button {
  display: inline-block;
  padding: 12px 20px;
  margin: 10px;
  border: 1px solid #ff7a00;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.button:hover {
  background: #ff7a00;
  color: black;
  box-shadow: 0 0 15px #ff7a00;
}

/* HOW TO BUY */
.steps {
  color: #ccc;
  line-height: 1.8;
}

/* FOLLOW */
.follow {
  margin-top: 40px;
}

.follow a {
  display: inline-block;
  padding: 10px 16px;
  border: 1px solid #ff7a00;
  border-radius: 10px;
  color: white;
  text-decoration: none;
}

.follow a:hover {
  background: #ff7a00;
  color: black;
}
</style>
</head>

<body>

<div class="container">

  <!-- SIGNAL LINE -->
  <img src="signal-line.png" class="signal-line">

  <h1>FlashVote</h1>
  <div class="tagline">Sentiment moves fast. Outcomes follow.</div>

  <div class="section-title">WHAT IS FLASHVOTE</div>
  <div class="divider"></div>
  <div class="text">
    FlashVote reflects fast-moving digital attention in real time.
  </div>

  <div class="section-title">CONTRACT ADDRESS</div>
  <div class="divider"></div>
  <div class="contract">0xYOURCONTRACTADDRESSHERE</div>

  <div class="section-title">BUY FLASHVOTE</div>
  <div class="buttons">
    <a href="#" class="button">Buy on Uniswap</a>
    <a href="#" class="button">View Chart</a>
  </div>

  <div class="section-title">HOW TO BUY</div>
  <div class="steps">
    1. Connect wallet<br>
    2. Paste contract address<br>
    3. Swap for FlashVote
  </div>

  <div class="follow">
    <div class="section-title">FOLLOW</div>
    <a href="https://x.com/flashvotehq" target="_blank">X</a>
  </div>

</div>

</body>
</html>
