<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>FlashVote</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    width:100%;
    min-height:100vh;
    min-height:100svh;
    overflow-x:hidden;
    background:#000;
    font-family:'Orbitron',sans-serif;
    color:#ffffff;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background-image:url('flashvote-about-bg.png');
    background-repeat:no-repeat;
    background-position:center center;
    background-size:auto 100%;
    opacity:0.92;
    z-index:-2;
}

/* DARK OVERLAY */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
        rgba(0,0,0,0.18) 0%,
        rgba(0,0,0,0.48) 45%,
        rgba(0,0,0,0.78) 100%);
    z-index:-1;
}

.page{
    width:100%;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:120px 24px 120px;
}

.content{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

/* TYPOGRAPHY */
.logo{
    font-size:clamp(3.2rem,7vw,5.8rem);
    font-weight:800;
    letter-spacing:-0.04em;
    line-height:1;
    margin-bottom:32px;
    color:#ffffff;
}

.tagline{
    font-size:clamp(1rem,2vw,2rem);
    color:rgba(255,255,255,0.78);
    line-height:1.5;
    margin-bottom:36px;
    max-width:900px;
}

.description{
    font-size:clamp(0.95rem,1.5vw,1.15rem);
    color:rgba(255,255,255,0.55);
    line-height:1.8;
    max-width:760px;
    margin-bottom:70px;
}

.section-label{
    font-size:0.78rem;
    letter-spacing:0.34em;
    color:rgba(255,255,255,0.55);
    margin-bottom:22px;
}

/* CONTRACT */
.contract-box{
    width:min(100%,640px);
    border:1px solid rgba(255,120,40,0.55);
    border-radius:14px;
    padding:18px 22px;
    background:rgba(0,0,0,0.34);
    color:#ffffff;
    font-size:1rem;
    overflow-wrap:anywhere;
    margin-bottom:18px;
}

.copy{
    color:#ff8a2d;
    font-size:0.95rem;
    margin-bottom:58px;
}

/* BUTTONS */
.button-group{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:68px;
}

.btn{
    min-width:200px;
    padding:18px 26px;
    border-radius:14px;
    border:1px solid rgba(255,120,40,0.55);
    color:#ff982f;
    text-decoration:none;
    font-size:1rem;
    transition:0.25s ease;
    background:rgba(0,0,0,0.28);
}

.btn:hover{
    background:rgba(255,140,50,0.12);
    border-color:#ff9a3c;
}

/* HOW TO BUY */
.steps{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:70px;
}

.steps div{
    color:rgba(255,255,255,0.82);
    font-size:1rem;
    line-height:1.6;
}

/* MOBILE PORTRAIT */
@media screen and (max-width:768px) and (orientation:portrait){

    body::before{
        background-size:100% auto;
        background-position:center center;
    }

    .page{
        padding:100px 24px 100px;
    }

    .logo{
        font-size:4rem;
    }

    .button-group{
        flex-direction:row;
        gap:16px;
    }

    .btn{
        min-width:unset;
        width:calc(50% - 8px);
        padding:16px 14px;
        font-size:0.95rem;
    }

    .contract-box{
        font-size:0.92rem;
        padding:16px;
    }

}

/* MOBILE LANDSCAPE */
@media screen and (max-width:950px) and (orientation:landscape){

    body::before{
        background-size:auto 100%;
        background-position:center center;
    }

    .page{
        padding:60px 24px 80px;
    }

}

/* LAPTOP / DESKTOP ONLY */
@media screen and (min-width:1024px) {

  body::before {
    background-size: 100% auto !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
  }

}

</style>
</head>

<body>

<div class="page">

<div class="content">

<h1 class="logo">FlashVote</h1>

<div class="tagline">
Sentiment moves fast. Outcomes follow.
</div>

<div class="description">
FlashVote reflects real-time shifts in digital attention.
</div>

<div class="section-label">
CONTRACT ADDRESS
</div>

<div class="contract-box">
0x1234567890abcdef1234567890abcdef12345678
</div>

<div class="copy">
Copy
</div>

<div class="section-label">
BUY FLASHVOTE
</div>

<div class="button-group">
<a href="#" class="btn">Buy on Uniswap</a>
<a href="#" class="btn">View Chart</a>
</div>

<div class="section-label">
HOW TO BUY
</div>

<div class="steps">
<div>Connect wallet</div>
<div>Paste contract address</div>
<div>Swap for FlashVote</div>
</div>

<div class="section-label">
FOLLOW
</div>

<div class="button-group">
<a href="#" class="btn">X (Twitter)</a>
</div>

</div>
</div>

</body>
</html>
