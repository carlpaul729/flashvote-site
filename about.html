<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashVote</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      text-align: center;
    }

    /* HERO SECTION */
    .hero {
      min-height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .hero-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    h1 {
      font-size: clamp(34px, 5vw, 52px);
      margin: 0;
    }

    .signal-line {
      width: clamp(220px, 50vw, 750px);
      opacity: 0.95;
      filter: drop-shadow(0 0 18px rgba(255,120,0,0.75));
    }

    .subtitle {
      color: #ccc;
      font-size: clamp(14px, 2vw, 18px);
    }

    /* SECTION TITLES */
    .section-title {
      color: #ff7a00;
      font-size: 20px;
      margin-top: 60px;
      letter-spacing: 1px;
    }

    .underline {
      width: 60px;
      height: 3px;
      background: #ff7a00;
      margin: 8px auto 20px;
      box-shadow: 0 0 10px #ff7a00;
    }

    /* TEXT */
    .section-text {
      color: #ccc;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
      padding: 0 20px;
    }

    /* CONTRACT BOX */
    .contract-box {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      border-radius: 12px;
      border: 2px solid #ff7a00;
      color: white;
      box-shadow: 0 0 15px rgba(255,122,0,0.6);
    }

    /* BUY SECTION */
    .buy-title {
      margin-top: 60px;
      color: #ff7a00;
      font-size: 20px;
    }

  </style>
</head>

<body>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-inner">

      <h1>FlashVote</h1>

      <img src="signal-line.png" class="signal-line">

      <div class="subtitle">
        Sentiment moves fast. Outcomes follow.
      </div>

    </div>
  </div>

  <!-- WHAT IS FLASHVOTE -->
  <div class="section-title">WHAT IS FLASHVOTE</div>
  <div class="underline"></div>

  <div class="section-text">
    FlashVote reflects fast-moving digital attention in real time.
  </div>

  <!-- CONTRACT -->
  <div class="section-title">CONTRACT ADDRESS</div>
  <div class="underline"></div>

  <div class="contract-box">
    0xYOURCONTRACTADDRESSHERE
  </div>

  <!-- BUY -->
  <div class="buy-title">BUY FLASHVOTE</div>

</body>
</html>
