<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashVote</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      text-align: center;
    }

    /* HERO */
    .hero {
      min-height: 100vh; /* restore full page */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 6px 0; /* tighter */
    }

    .signal-line {
      width: 600px;
      max-width: 80%;
      margin: 4px 0 6px; /* tighter */
      filter: drop-shadow(0 0 18px rgba(255,120,0,0.75));
    }

    .subtitle {
      color: #ccc;
      font-size: 16px;
      margin-bottom: 30px; /* keeps spacing before next section */
    }

    /* SECTION TITLES */
    .section-title {
      color: #ff7a00;
      font-size: 20px;
      margin-top: 60px;
    }

    .underline {
      width: 60px;
      height: 3px;
      background: #ff7a00;
      margin: 8px auto 20px;
      box-shadow: 0 0 10px #ff7a00;
    }

    .section-text {
      color: #ccc;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
      padding: 0 20px;
    }

    .contract-box {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      border-radius: 12px;
      border: 2px solid #ff7a00;
      color: white;
      box-shadow: 0 0 15px rgba(255,122,0,0.6);
    }

    .buy-title {
      margin-top: 60px;
      margin-bottom: 120px; /* IMPORTANT → restores scroll */
      color: #ff7a00;
      font-size: 20px;
    }

  </style>
</head>

<body>

  <!-- HERO -->
  <div class="hero">

    <h1>FlashVote</h1>

    <img src="signal-line.png" class="signal-line">

    <div class="subtitle">
      Sentiment moves fast. Outcomes follow.
    </div>

  </div>

  <!-- WHAT IS FLASHVOTE -->
  <div class="section-title">WHAT IS FLASHVOTE</div>
  <div class="underline"></div>

  <div class="section-text">
    FlashVote reflects fast-moving digital attention in real time.
  </div>

  <!-- CONTRACT -->
  <div class="section-title">CONTRACT ADDRESS</div>
  <div class="underline"></div>

  <div class="contract-box">
    0xYOURCONTRACTADDRESSHERE
  </div>

  <!-- BUY -->
  <div class="buy-title">BUY FLASHVOTE</div>

</body>
</html>
